name: Harness requeue

# Starts Claude on a newly opened task Issue that has no queue label, and
# restarts Claude when Zaneta answers a NEEDS_ZANETA with a ZANETA_DECISION
# comment or Santiago posts a CHANGES_REQUESTED review naming the PR's current
# head (--changes-requested; replaces santiago-changes-requested-requeue.yml)
# -- so no human ever has to add or re-add a label. It only
# (re-)applies the queue label: on an Issue with the owner's token, so the
# Claude Cloud Routine Bridge workflow fires as for a manual label; on a PR
# with GITHUB_TOKEN, and this run then starts Claude itself (steps below).
# Logic: .github/scripts/harness_requeue.py (offline-tested in
# test_harness_requeue.py). Shared harness kit file (docs/HARNESS_TEMPLATE.md).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: harness-requeue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  requeue:
    if: >-
      github.event_name == 'issues' ||
      contains(github.event.comment.body, 'ZANETA_DECISION') ||
      contains(github.event.comment.body, 'CHANGES_REQUESTED')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this repository's own trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start or restart Claude
        id: requeue
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN_TOKEN: ${{ secrets.SANTIAGO_CODEX_BRIDGE_TOKEN }}
          AUTHORIZED_HUMAN: ${{ vars.HARNESS_HUMAN_LOGIN }}
        run: |
          python3 .github/scripts/harness_requeue.py \
            --human "${AUTHORIZED_HUMAN:-zanetaseiler}" \
            --repo "${{ github.repository }}" \
            --changes-requested

      # A restart on a PR starts Claude from this run, which the comment
      # started: GitHub runs no pull_request workflow on a PR with a merge
      # conflict, so the bridge's own `labeled` trigger would never fire there
      # (trafficdom #221/#228). Same one-session guard and same bridge script
      # as claude-cloud-routine-bridge.yml.
      - name: Refuse a second session for the same Block
        id: guard
        if: steps.requeue.outputs.start_pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/harness_guard.py check \
            --repo "${{ github.repository }}" --kind pr \
            --number "${{ steps.requeue.outputs.start_pr }}"

      - name: Start Claude on the PR directly
        if: steps.guard.outputs.go == 'true'
        env:
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/claude_cloud_bridge.py \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.requeue.outputs.start_pr }}"
