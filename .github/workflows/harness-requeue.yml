name: Harness requeue

# Starts Claude on a newly opened task Issue that has no queue label, and
# restarts Claude when Zaneta answers a NEEDS_ZANETA with a ZANETA_DECISION
# comment or Santiago posts a CHANGES_REQUESTED review naming the PR's current
# head (--changes-requested; replaces santiago-changes-requested-requeue.yml)
# -- so no human ever has to add or re-add a label. It only
# (re-)applies the queue label with the owner's token; the existing Claude
# Cloud Routine Bridge workflow then fires exactly as for a manual label.
# Logic: .github/scripts/harness_requeue.py (offline-tested in
# test_harness_requeue.py). Shared harness kit file (docs/HARNESS_TEMPLATE.md).

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: harness-requeue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  requeue:
    if: >-
      github.event_name == 'issues' ||
      contains(github.event.comment.body, 'ZANETA_DECISION') ||
      contains(github.event.comment.body, 'CHANGES_REQUESTED')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this repository's own trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Start or restart Claude
        env:
          GH_TOKEN: ${{ github.token }}
          HUMAN_TOKEN: ${{ secrets.SANTIAGO_CODEX_BRIDGE_TOKEN }}
          AUTHORIZED_HUMAN: ${{ vars.HARNESS_HUMAN_LOGIN }}
        run: |
          python3 .github/scripts/harness_requeue.py \
            --human "${AUTHORIZED_HUMAN:-zanetaseiler}" \
            --repo "${{ github.repository }}" \
            --changes-requested
