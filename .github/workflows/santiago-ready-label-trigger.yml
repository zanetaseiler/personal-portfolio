name: Santiago READY trigger

# Claude -> Santiago handoff. A READY_FOR_SANTIAGO comment on a PR (or the
# READY_FOR_SANTIAGO label) wakes Codex by posting "@codex review" as the
# repository owner. All parsing lives in .github/scripts/harness_handoff.py
# (offline-tested in tests/isolation/test_harness_handoff.py); a rejected
# handoff posts HANDOFF_IGNORED with the reason instead of exiting silently.
# See docs/HARNESS_TEMPLATE.md.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: santiago-ready-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handoff-to-codex-review:
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'READY_FOR_SANTIAGO') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'READY_FOR_SANTIAGO'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout this repository's own trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate handoff and wake Codex as the owner
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_WAKE_TOKEN: ${{ secrets.SANTIAGO_CODEX_BRIDGE_TOKEN }}
          # The one human allowed to hand off. Never the repository owner:
          # for an organization repo that is the org, not a person.
          AUTHORIZED_HUMAN: ${{ vars.HARNESS_HUMAN_LOGIN }}
        run: |
          python3 .github/scripts/harness_handoff.py \
            --human "${AUTHORIZED_HUMAN:-zanetaseiler}" \
            --repo "${{ github.repository }}" \
            --number "${{ github.event.pull_request.number || github.event.issue.number }}" \
            ${{ github.event_name == 'pull_request' && '--label-event' || '' }}
