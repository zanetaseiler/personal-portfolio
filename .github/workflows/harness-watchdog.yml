name: Harness watchdog

# Every 15 minutes, posts one HARNESS_STALLED comment on any open Issue/PR
# where the Claude <-> Codex loop has silently stopped, naming the stuck
# step and the one fix. Comment-only: never labels, never wakes Codex, never
# fires Claude. Logic: .github/scripts/harness_watchdog.py (offline-tested in
# tests/isolation/test_harness_watchdog.py). See docs/HARNESS_TEMPLATE.md.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: harness-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this repository's own trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Report stalled harness items
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/harness_watchdog.py --repo "${{ github.repository }}"
