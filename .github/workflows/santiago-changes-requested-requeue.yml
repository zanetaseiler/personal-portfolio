name: Santiago CHANGES_REQUESTED requeue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: santiago-correction-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  requeue-claude:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Convert exact Santiago correction into Claude pickup label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          first_nonblank="$(printf '%s\n' "$COMMENT_BODY" | sed '/^[[:space:]]*$/d' | head -n1 | xargs)"
          if [ "$first_nonblank" != "CHANGES_REQUESTED" ]; then exit 0; fi
          if [ "$COMMENTER" != "$OWNER" ]; then exit 0; fi
          head_sha="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          if [[ "$COMMENT_BODY" != *"$head_sha"* ]]; then exit 0; fi
          if gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -Fxq 'READY_FOR_CLAUDE_CLOUD'; then exit 0; fi
          if ! gh api "repos/${REPO}/labels/READY_FOR_CLAUDE_CLOUD" >/dev/null 2>&1; then
            gh api --method POST "repos/${REPO}/labels" -f name='READY_FOR_CLAUDE_CLOUD' -f color='aaaaaa' -f description='Claude cloud pickup queue' >/dev/null
          fi
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/labels" -f 'labels[]=READY_FOR_CLAUDE_CLOUD' >/dev/null
          echo "Applied READY_FOR_CLAUDE_CLOUD to PR #${PR_NUMBER} @ ${head_sha}."
