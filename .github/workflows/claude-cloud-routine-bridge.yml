name: Claude Cloud Routine Bridge

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: claude-cloud-routine-bridge-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fire:
    if: github.event.label.name == 'READY_FOR_CLAUDE_CLOUD'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Determine issue/PR flag
        id: item
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then echo "flag=--issue" >> "$GITHUB_OUTPUT"; else echo "flag=--pr" >> "$GITHUB_OUTPUT"; fi
      - name: Fire Claude cloud Routine
        env:
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/claude_cloud_bridge.py --repo "${{ github.repository }}" ${{ steps.item.outputs.flag }} "${{ github.event.issue.number || github.event.pull_request.number }}"
