name: Codex clean review → VERIFIED

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  # The automatic merge step reads the head's check runs and commit status
  # before merging (bonafide PR #14 was skipped without these).
  checks: read
  statuses: read

concurrency:
  group: codex-clean-verified-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate clean Codex review against current head
        id: validate
        uses: actions/github-script@v8
        with:
          script: |
            const actor = context.payload.comment?.user?.login || "";
            const body = context.payload.comment?.body || "";

            if (actor !== "chatgpt-codex-connector[bot]") {
              core.info(`Ignoring comment from ${actor}.`);
              core.setOutput("valid", "false");
              return;
            }

            if (!body.includes("Didn't find any major issues")) {
              core.info("Ignoring non-clean Codex comment.");
              core.setOutput("valid", "false");
              return;
            }

            const reviewed = (
              body.match(/Reviewed commit:\*{0,2}\s*`?([0-9a-f]{7,40})`?/i) ||
              body.match(/Commit reviewed:\*{0,2}\s*`?([0-9a-f]{7,40})`?/i) ||
              []
            )[1];

            if (!reviewed) {
              core.setFailed("Clean Codex comment is missing a reviewed commit SHA.");
              return;
            }

            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const currentHead = pr.head.sha.toLowerCase();
            const reviewedHead = reviewed.toLowerCase();

            if (!currentHead.startsWith(reviewedHead)) {
              core.info(`Ignoring stale clean review: ${reviewedHead} != ${currentHead}.`);
              core.setOutput("valid", "false");
              return;
            }

            const marker = `VERIFIED:${currentHead}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull_number,
              per_page: 100,
            });

            if (comments.some(comment => (comment.body || "").includes(marker))) {
              core.info("Exact-head VERIFIED marker already exists.");
              core.setOutput("valid", "false");
              return;
            }

            core.setOutput("valid", "true");
            core.setOutput("head_sha", currentHead);

      - name: Record VERIFIED
        if: steps.validate.outputs.valid == 'true'
        uses: actions/github-script@v8
        env:
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const head = process.env.HEAD_SHA;

            for (const label of ["READY_FOR_SANTIAGO", "controller:READY_FOR_SANTIAGO"]) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ["VERIFIED"] });

            const body = [
              "VERIFIED",
              "",
              `- exact head commit SHA: \`${head}\``,
              "- reviewer: Santiago/Codex",
              "- result: Codex found no major issues on this exact head",
              "- next: automatic merge once every check on this head has passed",
              `- marker: VERIFIED:${head}`,
            ].join("\n");

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`Recorded VERIFIED for PR #${issue_number} @ ${head}.`);

      # Žaneta's standing decision (2026-09-25): a VERIFIED PR merges without
      # waiting for her. The script pins the VERIFIED SHA, waits for checks,
      # skips HOLD/draft/conflicted PRs and posts MERGED or AUTO_MERGE_SKIPPED.
      # It merges with the owner's token so push-triggered workflows still run.
      - name: Checkout this repository's own trusted default-branch code
        if: steps.validate.outputs.valid == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Merge the VERIFIED head automatically
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.SANTIAGO_CODEX_BRIDGE_TOKEN }}
          HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
        run: |
          python3 .github/scripts/harness_automerge.py \
            --repo "${{ github.repository }}" \
            --number "${{ github.event.issue.number }}" \
            --head "$HEAD_SHA"
